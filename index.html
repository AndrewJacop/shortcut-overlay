<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShortcutOverlay</title>
    <script>
      // Apply dark class before first paint to avoid flash of wrong theme.
      // Default to dark; React will correct if config says otherwise.
      document.documentElement.classList.add('dark');
      document.documentElement.style.setProperty('--overlay-bg-rgb', '24, 24, 27');
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
